on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      reason:
        type: string
        required: true
        description: Why did you retrigger the deploy?

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: "Manual deploy triggered: ${{inputs.reason}}"
        if: ${{ inputs.reason }}
        env:
          TEXT: ${{inputs.reason}}
        run: "echo Manual deploy triggered: $TEXT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2
        with:
          cache: true
      - run: pnpm run build --base ${{github.event.repository.name}}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: dist/

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{steps.deployment.outputs.page_url}}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
