on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      reason:
        type: string
        required: true
        description: Why did you retrigger the deploy?

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: "Manual deploy triggered: ${{inputs.reason}}"
        if: ${{ inputs.reason }}
        run: "echo Manual deploy triggered: ${{inputs.reason}}"
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v2
      - run: pnpm run build --base ${{github.event.repository.name}}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{steps.deployment.outputs.page_url}}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
