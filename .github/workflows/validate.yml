on:
  pull_request_target:
    paths:
      - slides.md

jobs:
  validate:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.ref }}-${{github.job}}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b
        with:
          cache: true
      - run: pnpm run build --base ${{github.event.repository.name}}
  md-check:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{github.ref}}-${{github.job}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff
