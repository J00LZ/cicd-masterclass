on:
  pull_request:
    paths:
      - slides.md

jobs:
  validate:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - uses: DavidAnson/markdownlint-cli2-action@v24
      - uses: pnpm/setup@v2
        with:
          cache: true
      - run: pnpm run build --base ${{github.event.repository.name}}
