version: 2
updates:
  - open-pull-requests-limit: 5
    package-ecosystem: github-actions
    rebase-strategy: auto
    schedule:
      interval: weekly
    directories:
      - .github/workflows
  - open-pull-requests-limit: 5
    package-ecosystem: npm
    rebase-strategy: auto
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    directories:
      - ./